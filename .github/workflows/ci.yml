name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test (usage errors exit 2)
        run: |
          set +e
          node dist/index.js https://example.com; code=$?
          test "$code" -eq 2 || { echo "expected exit 2 without --yes, got $code"; exit 1; }
